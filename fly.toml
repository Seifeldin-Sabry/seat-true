# Deploy from repository root: fly deploy (or bun run secrets:fly first).
# One app serves the site, the product app and the API under /api.
# Secrets (fly secrets set -a seattrue ...): DATABASE_URL, BETTER_AUTH_SECRET,
# and optional UPSTASH_*, QSTASH_*, RESEND_*, EMAIL_FROM, STRIPE_*, GOOGLE_*.
app = "seattrue"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_APP_ORIGIN = "https://seattrue.fly.dev"
    VITE_WEB_ORIGIN = "https://seattrue.fly.dev"

[deploy]
  # Runs once per deploy in a temporary machine with the app's secrets.
  release_command = "bun run --cwd packages/db db:migrate"

[env]
  APP_ORIGIN = "https://seattrue.fly.dev"
  REDIS_KEY_NAMESPACE = "seattrue:prod"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Stripe webhooks and QStash callbacks wake it anyway; one warm machine avoids cold auth.
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
